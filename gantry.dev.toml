# Main App Settings
stage = "DEV"
allowed_origins = "*"
port = 8000
internal_port = 9000
# workers = 2
# internal_workers = 2

[db]
# Required: Database connection strings
pgvector_connection_uri = "postgresql://user:password@localhost:5432/vector_db"
timescale_connection_uri = "postgresql://user:password@localhost:5433/timescale_db"
redis_connection_uri = "redis://localhost:6379/0"

[apikey]
# Required: Secret for API key generation (minimum 16 characters)
secret = "your-minimum-16-char-secret-key"
secret_length = 32

[auth]
server_url = "http://localhost:8000/"
client_id = "example_client"
realm_name = "example_realm"

[billing]
# Required: Stripe API secret
stripe_secret_key = "sk_test_example_key"

[user_log]
loki_url = "http://localhost:3100/"

[conversation]
cache_ttl = 600
cache_limit = 50

[file_storage]
# Required: S3 / Object Storage configuration
s3_bucket_name = "my-app-bucket"
s3_region_name = "us-east-1"
s3_access_key_id = "AKIA..."
s3_secret_access_key = "secret-key"
s3_endpoint_url = "https://s3.amazonaws.com"
s3_presigned_url_expiry_seconds = 3600
redis_cache_expiry_seconds = 3600

[organization]
# Required: Keycloak and Invitation settings
keycloak_service_client_id = "med-ai-saas-backend"
keycloak_service_client_secret = "your-service-client-secret"
invite_client_id = "your-invite-client-id"
invite_redirect_uri = "http://localhost:3000"
# default_rate_limit = null
deletion_cancel_window_days = 30
deletion_worker_interval_seconds = 60

[observability]
exporter_otlp_endpoint = "http://localhost:4317/"
exporter_otlp_protocol = "grpc"
traces = "disabled"
metrics = "disabled"
logs = "disabled"
prometheus_port = 9000
