services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./asset/otel/otel-collector-config.yaml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver port
      - "4318:4318" # OTLP HTTP receiver port
      - "13133:13133" # Health check port
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:13133/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - jaeger
      - prometheus
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
      - "--enable-feature=native-histograms"
      - "--storage.tsdb.retention.time=7d" # Retention period for metrics
      - "--storage.tsdb.retention.size=100MB" # Retention size limit for metrics
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI and API
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  loki:
    image: grafana/loki:latest
    container_name: loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
      - "-store.retention=7d" # Retention period for logs
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100" # Loki API
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    command:
      - "--badger.span-store-ttl=168h" # Retention period for traces and spans
    user: root # to fix permission issues with badger storage (/badger/data, /badger/key)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger
    ports:
      - "16686:16686" # Jaeger UI
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./asset/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3001:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 500M
        reservations:
          cpus: "0.1"
          memory: 300M

  timescale_db:
    image: timescale/timescaledb:latest-pg17
    container_name: timescale-db
    env_file:
      - .env.postgres-timescale
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql
    healthcheck:
      test: sh -c "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 200M
        reservations:
          cpus: "0.1"
          memory: 20M

  db:
    image: pgvector/pgvector:pg18
    container_name: postgres-pgvector
    env_file:
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: sh -c "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 200M
        reservations:
          cpus: "0.1"
          memory: 20M

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    env_file:
      - .env.redis
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_FEATURES=organization,opentelemetry-metrics,opentelemetry-logs
      - KC_TELEMETRY_ENDPOINT=http://otelcol:4317
      - KC_TELEMETRY_RESOURCE_ATTRIBUTES=service.name=keycloak,deployment.environment=dev
      - KC_TRACING_ENABLED=true
      - KC_TELEMETRY_LOGS_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_TELEMETRY_METRICS_ENABLED=true
    ports:
      - "8080:8080"
    command: start-dev --import-realm --http-access-log-enabled=true
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./asset/dev-realm.json:/opt/keycloak/data/import/dev-realm.json:ro
      - ./asset/keycloak-themes:/opt/keycloak/themes
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M

volumes:
  timescale_data:
  postgres_data:
  redis_data:
  keycloak_data:
  prometheus_data:
  loki_data:
  jaeger_data:
  grafana_data:
