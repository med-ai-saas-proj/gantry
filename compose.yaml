services:
  db:
    image: pgvector/pgvector:pg18
    container_name: postgres-pgvector
    env_file:
      - .env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - db_network

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    env_file:
      - .env.redis
    volumes:
      - redis_data:/data
    networks:
      - redis_network


  main:
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    build:
      context: .
    ports:
      - "8000:8000"
    pull_policy: always # Ensures compose always tries to pull a new image
    networks:
      - db_network
      - redis_network

networks:
  db_network:
  redis_network:

volumes:
  postgres_data:
