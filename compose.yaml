services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./asset/otel/otel-collector-config.yaml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver port
      - "4318:4318" # OTLP HTTP receiver port
      - "13133:13133" # Health check port
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M
    profiles:
      - full

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
      - "--enable-feature=native-histograms"
      - "--storage.tsdb.retention.time=7d" # Retention period for metrics
      - "--storage.tsdb.retention.size=100MB" # Retention size limit for metrics
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI and API
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M
    profiles:
      - full

  loki:
    image: grafana/loki:latest
    container_name: loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
      - "-store.retention=7d" # Retention period for logs
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100" # Loki API
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    command:
      - "--badger.span-store-ttl=168h" # Retention period for traces and spans
    user: root # to fix permission issues with badger storage (/badger/data, /badger/key)
    environment:
      COLLECTOR_OTLP_ENABLED: true
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: false
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger
    ports:
      - "16686:16686" # Jaeger UI
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M
    profiles:
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./asset/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3001:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 300M
        reservations:
          cpus: "0.1"
          memory: 200M
    profiles:
      - full

  timescale_db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: timescale-db
    environment:
      POSTGRES_DB: gantry
      POSTGRES_USER: gantry
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb,pg_textsearch"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 200M
        reservations:
          cpus: "0.1"
          memory: 100M

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  mailpit:
    image: axllent/mailpit:v1.29
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    command: start-dev --import-realm --http-access-log-enabled=true
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./asset/gantry-realm.json:/opt/keycloak/data/import/gantry-realm.json:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.4"
          memory: 512M

  gantry:
    build: .
    container_name: gantry
    network_mode: "host"
    restart: unless-stopped
    ports:
      - "8000:8000"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 10 &&
        echo 'Migrating' &&
        uv run gantry server --config-file example.gantry.toml migrate &&
        echo 'Running server' &&
        uv run gantry server --config-file example.gantry.toml
    profiles:
      - frontend-dev

volumes:
  timescale_data:
  postgres_data:
  redis_data:
  keycloak_data:
  prometheus_data:
  loki_data:
  jaeger_data:
  grafana_data:
  mailpit_data:
