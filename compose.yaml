services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./asset/otel/otel-collector-config.yaml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver port
      - "4318:4318" # OTLP HTTP receiver port
      - "13133:13133" # Health check port
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M
    profiles:
      - full

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
      - "--enable-feature=native-histograms"
      - "--storage.tsdb.retention.time=7d" # Retention period for metrics
      - "--storage.tsdb.retention.size=100MB" # Retention size limit for metrics
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI and API
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M
    profiles:
      - full

  loki:
    image: grafana/loki:latest
    container_name: loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
      - "-store.retention=7d" # Retention period for logs
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100" # Loki API
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    command:
      - "--badger.span-store-ttl=168h" # Retention period for traces and spans
    user: root # to fix permission issues with badger storage (/badger/data, /badger/key)
    environment:
      COLLECTOR_OTLP_ENABLED: true
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: false
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger
    ports:
      - "16686:16686" # Jaeger UI
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M
    profiles:
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./asset/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3001:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 300M
        reservations:
          cpus: "0.1"
          memory: 200M
    profiles:
      - full

  timescale_db:
    image: timescale/timescaledb:latest-pg18
    container_name: timescale-db
    environment:
      POSTGRES_DB: gantry
      POSTGRES_USER: gantry
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 200M
        reservations:
          cpus: "0.1"
          memory: 100M

  vector-db:
    image: pgvector/pgvector:pg18
    container_name: postgres-pgvector
    environment:
      POSTGRES_DB: gantry
      POSTGRES_USER: gantry
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 200M
        reservations:
          cpus: "0.1"
          memory: 100M

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  mailpit:
    image: axllent/mailpit:v1.29
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_FEATURES: organization,opentelemetry-metrics,opentelemetry-logs
      KC_TELEMETRY_ENDPOINT: http://otelcol:4317
      KC_TELEMETRY_RESOURCE_ATTRIBUTES: service.name=keycloak,deployment.environment=dev
      KC_TRACING_ENABLED: "true"
      KC_TELEMETRY_LOGS_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_TELEMETRY_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    command: start-dev --import-realm --http-access-log-enabled=true
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./asset/gantry-realm.json:/opt/keycloak/data/import/gantry-realm.json:ro
      - ./asset/keycloak-themes:/opt/keycloak/themes
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.4"
          memory: 512M

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.99
    container_name: rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfs-access-key
      RUSTFS_SECRET_KEY: rustfs-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
        reservations:
          cpus: "0.1"
          memory: 20M

  rustfs-setup:
    image: minio/mc
    environment:
      MINIO_HOST: rustfs
      MINIO_PORT: 9000
      MINIO_USER: rustfsadmin
      MINIO_PASS: rustfsadmin
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        until mc alias set rustfs http://rustfs:9000 rustfs-access-key rustfs-secret-key; do
          echo 'RustFS is not ready yet, retrying in 2 seconds...'
          sleep 2
        done

        echo '1. Create private bucket if not exists'
        mc mb rustfs/private-files --ignore-existing

        echo '2. Set Policy PRIVATE for private bucket'
        mc anonymous set none rustfs/private-files

        echo 'RustFS Configuration Complete!'

  self:
    image: ghcr.io/astral-sh/uv:0.11.8
    container_name: gantry
    network_mode: "host"
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    command: |
      uv run gantry server --config-file example.gantry.toml migrate
      && uv run gantry server --config-file example.gantry.toml
    profiles:
      - frontend-dev

volumes:
  timescale_data:
  postgres_data:
  redis_data:
  keycloak_data:
  prometheus_data:
  loki_data:
  jaeger_data:
  grafana_data:
  mailpit_data:
  rustfs_data:
