[run]
source = src/gantry

[report]
include =
    src/gantry/management/admin/routes.py
    src/gantry/management/api_key/routes.py
    src/gantry/management/billing/routers/*.py
    src/gantry/management/logging/routers.py
    src/gantry/management/organization/routes.py
    src/gantry/management/project/routes.py
    src/gantry/service/conversation/routers.py
    src/gantry/service/file_storage/routers/*.py
    src/gantry/service/rag/routers/*.py
    src/gantry/api_gateway/routes.py
    src/gantry/main/app.py
show_missing = true
