<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venera API Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .form-container {
        max-width: 400px;
        width: 100%;
      }
      .api-card {
        transition: all 0.3s ease;
      }
      .api-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      #response-container {
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-800">
    <div id="app" class="container mx-auto p-4 md:p-8">
      <!-- Auth Section -->
      <div
        id="auth-section"
        class="flex items-center justify-center min-h-screen"
      >
        <div class="w-full max-w-md">
          <!-- Login Form -->
          <div id="login-view">
            <div class="bg-white p-8 rounded-lg shadow-lg">
              <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">
                Login
              </h2>
              <form id="login-form">
                <div class="mb-4">
                  <label
                    for="login-email"
                    class="block text-sm font-medium text-gray-600 mb-2"
                    >Email</label
                  >
                  <input
                    type="email"
                    id="login-email"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="user@example.com"
                  />
                </div>
                <div class="mb-6">
                  <label
                    for="login-password"
                    class="block text-sm font-medium text-gray-600 mb-2"
                    >Password</label
                  >
                  <input
                    type="password"
                    id="login-password"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="********"
                  />
                </div>
                <button
                  type="submit"
                  class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition duration-300"
                >
                  Login
                </button>
              </form>
              <p class="text-center text-sm text-gray-500 mt-6">
                Don't have an account?
                <a
                  href="#"
                  id="show-register"
                  class="text-indigo-600 hover:underline font-medium"
                  >Register here</a
                >
              </p>
            </div>
          </div>

          <!-- Register Form -->
          <div id="register-view" class="hidden">
            <div class="bg-white p-8 rounded-lg shadow-lg">
              <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">
                Register
              </h2>
              <form id="register-form">
                <div class="mb-4">
                  <label
                    for="register-email"
                    class="block text-sm font-medium text-gray-600 mb-2"
                    >Email</label
                  >
                  <input
                    type="email"
                    id="register-email"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="user@example.com"
                  />
                </div>
                <div class="mb-6">
                  <label
                    for="register-password"
                    class="block text-sm font-medium text-gray-600 mb-2"
                    >Password</label
                  >
                  <input
                    type="password"
                    id="register-password"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="********"
                  />
                </div>
                <button
                  type="submit"
                  class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition duration-300"
                >
                  Register
                </button>
              </form>
              <p class="text-center text-sm text-gray-500 mt-6">
                Already have an account?
                <a
                  href="#"
                  id="show-login"
                  class="text-indigo-600 hover:underline font-medium"
                  >Login here</a
                >
              </p>
            </div>
          </div>
          <div id="auth-message" class="mt-4 text-center"></div>
        </div>
      </div>

      <!-- Main Content -->
      <div id="main-section" class="hidden">
        <header class="flex justify-between items-center mb-8 pb-4 border-b">
          <h1 class="text-3xl font-bold text-gray-800">Venera API Demo</h1>
          <button
            id="logout-btn"
            class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition"
          >
            Logout
          </button>
        </header>

        <!-- API Interaction Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <!-- Left Column: API Actions -->
          <div>
            <h2 class="text-2xl font-semibold mb-4">API Actions</h2>
            <div class="space-y-6">
              <!-- EHR Summarize -->
              <div class="api-card bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold mb-3">Summarize EHR</h3>
                <form id="summarize-form">
                  <label
                    for="summarize-ehr"
                    class="block text-sm font-medium text-gray-600 mb-2"
                    >EHR JSON</label
                  >
                  <textarea
                    id="summarize-ehr"
                    rows="8"
                    class="w-full p-2 border border-gray-300 rounded-md text-sm"
                  >
{ "type": "custom_json", "custom_json": { "patient_id": "123", "notes": "Patient presents with cough and fever." } }
                </textarea
                  >
                  <button
                    type="submit"
                    class="mt-4 w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600"
                  >
                    Summarize
                  </button>
                </form>
              </div>

              <!-- Rx Advisor -->
              <div class="api-card bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold mb-3">Rx Advisor</h3>
                <form id="rx-advisor-form">
                  <label
                    for="rx-ehr"
                    class="block text-sm font-medium text-gray-600 mb-2"
                    >EHR JSON</label
                  >
                  <textarea
                    id="rx-ehr"
                    rows="6"
                    class="w-full p-2 border border-gray-300 rounded-md text-sm"
                  >
{ "type": "custom_json", "custom_json": { "patient_id": "123", "conditions": ["hypertension"] } }</textarea
                  >
                  <label
                    for="rx-prescription"
                    class="mt-4 block text-sm font-medium text-gray-600 mb-2"
                    >Prescription JSON</label
                  >
                  <textarea
                    id="rx-prescription"
                    rows="4"
                    class="w-full p-2 border border-gray-300 rounded-md text-sm"
                  >
{ "type": "custom_json", "custom_json": [{ "medication": "Lisinopril", "dosage": "10mg" }] }
                </textarea
                  >
                  <button
                    type="submit"
                    class="mt-4 w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600"
                  >
                    Get Advice
                  </button>
                </form>
              </div>

              <!-- AI Search -->
              <div class="api-card bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold mb-3">AI Search</h3>
                <form id="ai-search-form">
                  <label
                    for="ai-query"
                    class="block text-sm font-medium text-gray-600 mb-2"
                    >Query</label
                  >
                  <input
                    type="text"
                    id="ai-query"
                    class="w-full p-2 border border-gray-300 rounded-md"
                    placeholder="e.g., latest treatments for diabetes"
                  />
                  <button
                    type="submit"
                    class="mt-4 w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600"
                  >
                    Search
                  </button>
                </form>
              </div>

              <!-- API Key Management -->
              <div class="api-card bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-bold mb-3">API Key Management</h3>
                <div class="flex space-x-4">
                  <button
                    id="list-keys-btn"
                    class="flex-1 bg-green-500 text-white py-2 rounded-md hover:bg-green-600"
                  >
                    List Keys
                  </button>
                  <button
                    id="create-key-btn"
                    class="flex-1 bg-green-500 text-white py-2 rounded-md hover:bg-green-600"
                  >
                    Create New Key
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Column: Response -->
          <div>
            <h2 class="text-2xl font-semibold mb-4">API Response</h2>
            <div
              class="bg-gray-800 text-white p-6 rounded-lg shadow-md min-h-[400px]"
            >
              <div id="loading-indicator" class="hidden text-center">
                <div
                  class="spinner animate-spin rounded-full h-8 w-8 border-b-2 border-white mx-auto"
                ></div>
                <p class="mt-2">Loading...</p>
              </div>
              <pre id="response-container" class="font-mono text-sm"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // --- Configuration ---
        const API_BASE_URL = "/api/v1";
        let authToken = null;
        function updateAuthToken(new_token = null) {
          const key = "venera_access_token";
          if (new_token) {
            localStorage.setItem(key, new_token);
          }
          authToken = localStorage.getItem(key);
        }
        updateAuthToken();

        // --- DOM Elements ---
        const authSection = document.getElementById("auth-section");
        const mainSection = document.getElementById("main-section");
        const loginView = document.getElementById("login-view");
        const registerView = document.getElementById("register-view");
        const showRegisterLink = document.getElementById("show-register");
        const showLoginLink = document.getElementById("show-login");
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const logoutBtn = document.getElementById("logout-btn");
        const responseContainer = document.getElementById("response-container");
        const loadingIndicator = document.getElementById("loading-indicator");
        const authMessage = document.getElementById("auth-message");

        const summarizeForm = document.getElementById("summarize-form");
        const rxAdvisorForm = document.getElementById("rx-advisor-form");
        const aiSearchForm = document.getElementById("ai-search-form");
        const listKeysBtn = document.getElementById("list-keys-btn");
        const createKeyBtn = document.getElementById("create-key-btn");

        // --- View Management ---
        const showView = (view) => {
          authSection.classList.add("hidden");
          mainSection.classList.add("hidden");
          loginView.classList.add("hidden");
          registerView.classList.add("hidden");

          if (view === "login" || view === "register") {
            authSection.classList.remove("hidden");
            if (view === "login") loginView.classList.remove("hidden");
            if (view === "register") registerView.classList.remove("hidden");
          } else if (view === "main") {
            mainSection.classList.remove("hidden");
          }
        };

        showRegisterLink.addEventListener("click", (e) => {
          e.preventDefault();
          authMessage.textContent = "";
          showView("register");
        });

        showLoginLink.addEventListener("click", (e) => {
          e.preventDefault();
          authMessage.textContent = "";
          showView("login");
        });

        // --- API Helper ---
        const apiCall = async (
          endpoint,
          method = "GET",
          body = null,
          requiresAuth = true
        ) => {
          loadingIndicator.classList.remove("hidden");
          responseContainer.textContent = "";

          const headers = { "Content-Type": "application/json" };
          if (requiresAuth && authToken) {
            headers["Authorization"] = `Bearer ${authToken}`;
          }

          const config = {
            method: method,
            headers: headers,
          };

          if (body) {
            config.body = JSON.stringify(body);
          }

          try {
            const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
            const result = await response.json();

            if (!response.ok) {
              throw result;
            }

            return result;
          } catch (error) {
            console.error("API Error:", error);
            let errorMessage = "An unexpected error occurred.";
            if (error.detail) {
              if (Array.isArray(error.detail)) {
                errorMessage = error.detail
                  .map((e) => `${e.loc.join(" -> ")}: ${e.msg}`)
                  .join("\n");
              } else if (typeof error.detail === "string") {
                errorMessage = error.detail;
              } else {
                errorMessage = JSON.stringify(error.detail, null, 2);
              }
            }
            displayResponse({ error: errorMessage });
            return null;
          } finally {
            loadingIndicator.classList.add("hidden");
          }
        };

        const displayResponse = (data) => {
          responseContainer.textContent = JSON.stringify(data, null, 2);
        };

        const showAuthMessage = (message, isError = false) => {
          authMessage.textContent = message;
          authMessage.className = `mt-4 text-center ${
            isError ? "text-red-500" : "text-green-500"
          }`;
        };

        // --- Authentication Logic ---
        registerForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          authMessage.textContent = "";
          const email = document.getElementById("register-email").value;
          const password = document.getElementById("register-password").value;

          try {
            const response = await fetch(`${API_BASE_URL}/auth/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            if (response.status === 201) {
              showAuthMessage("Registration successful! Please login.", false);
              showView("login");
              registerForm.reset();
            } else {
              const errorData = await response.json();
              throw errorData;
            }
          } catch (error) {
            console.error("Registration failed:", error);
            const errorMessage =
              error.detail?.[0]?.msg || "Registration failed.";
            showAuthMessage(errorMessage, true);
          }
        });

        loginForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          authMessage.textContent = "";
          const email = document.getElementById("login-email").value;
          const password = document.getElementById("login-password").value;

          try {
            const response = await fetch(`${API_BASE_URL}/auth/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            if (!response.ok) {
              throw data;
            }

            authToken = data.token;
            updateAuthToken(authToken);
            showView("main");
          } catch (error) {
            console.error("Login failed:", error);
            const errorMessage = error.detail || "Invalid email or password.";
            showAuthMessage(errorMessage, true);
          }
        });

        logoutBtn.addEventListener("click", () => {
          authToken = null;
          showView("login");
          loginForm.reset();
          responseContainer.textContent = "";
          authMessage.textContent = "";
        });

        // --- Main App Logic ---
        const parseJsonInput = (elementId, fieldName) => {
          const text = document.getElementById(elementId).value;
          try {
            return JSON.parse(text);
          } catch (e) {
            displayResponse({ error: `Invalid JSON in ${fieldName} field.` });
            return null;
          }
        };

        summarizeForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const ehr = parseJsonInput("summarize-ehr", "EHR JSON");
          if (!ehr) return;

          const result = await apiCall("/ehr_summarize", "POST", {
            ehr,
            stream: false,
          });
          if (result) displayResponse(result);
        });

        rxAdvisorForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const ehr = parseJsonInput("rx-ehr", "EHR JSON");
          if (!ehr) return;
          const prescription = parseJsonInput(
            "rx-prescription",
            "Prescription JSON"
          );
          if (!prescription) return;

          const result = await apiCall("/rx_advisor", "POST", {
            ehr,
            prescription,
            stream: false,
          });
          if (result) displayResponse(result);
        });

        aiSearchForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const query = document.getElementById("ai-query").value;
          if (!query) {
            displayResponse({ error: "Query cannot be empty." });
            return;
          }

          const result = await apiCall("/ai_search", "POST", {
            query,
            model: "",
            convesation_id: "",
            stream: false,
          });
          if (result) displayResponse(result);
        });

        listKeysBtn.addEventListener("click", async () => {
          const result = await apiCall("/api-key/list", "GET");
          if (result) displayResponse(result);
        });

        createKeyBtn.addEventListener("click", async () => {
          const name = prompt("Enter a name for the new API key:");
          if (name) {
            const result = await apiCall("/api-key/create", "POST", { name });
            if (result) {
              alert(
                `API Key created! Please save it securely:\n\n${result.api_key}\n\nYou will not be able to see it again.`
              );
              displayResponse(result);
            }
          }
        });

        // --- Initial View ---
        if (authToken) {
          showView("main");
        } else {
          showView("login");
        }
      });
    </script>
  </body>
</html>
