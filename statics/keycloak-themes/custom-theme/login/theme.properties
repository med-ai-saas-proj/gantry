# Keycloak Glassmorphism Theme Configuration
# This theme provides a modern glassmorphism design with animated elements

# Parent theme - extending base Keycloak theme
parent=base

# Import statements for different parts
import=common/keycloak

# Styles configuration
styles=css/login.css css/register.css

# Scripts configuration  
scripts=js/theme.js

# Properties for customization
properties=kcHtmlClass kcBodyClass kcLoginClass kcFormClass kcButtonClass kcInputClass

# HTML class for the root element
kcHtmlClass=

# Body class for styling the main body
kcBodyClass=bg-animated min-h-screen

# Login container classes
kcLoginClass=min-h-screen flex items-center justify-center p-4

# Form wrapper classes
kcFormClass=space-y-6

# Button classes with glassmorphism styling
kcButtonClass=glass-button w-full py-3 px-6 rounded-xl text-white font-semibold

# Input field classes
kcInputClass=glass-input w-full px-4 py-3 rounded-xl text-white

# Social providers configuration
kcFormSocialAccountContentClass=mt-6
kcFormSocialAccountListClass=space-y-3
kcFormSocialAccountListButtonClass=glass w-full flex justify-center items-center px-4 py-3 rounded-xl

# Header styling
kcFormHeaderClass=text-center mb-6

# Info section styling  
kcInfoAreaWrapperClass=text-center mt-6 p-4 glass rounded-2xl

# Alert/Message styling
kcAlertClass=rounded-2xl p-4 text-center backdrop-blur-sm
kcAlertErrorClass=alert-error
kcAlertWarningClass=alert-info
kcAlertSuccessClass=alert-success
kcAlertInfoClass=alert-info

# Form group styling
kcFormGroupClass=space-y-2
kcLabelWrapperClass=
kcLabelClass=glass-label
kcInputWrapperClass=relative group

# Checkbox styling
kcInputGroupClass=flex items-center space-x-2

# Loading and feedback states
kcFeedbackAreaClass=
kcFeedbackTextClass=text-red-300 text-sm mt-1 flex items-center

# Logo and branding
kcLogoIdP-facebook=fa fa-facebook
kcLogoIdP-github=fa fa-github  
kcLogoIdP-google=fa fa-google
kcLogoIdP-microsoft=fa fa-microsoft
kcLogoIdP-twitter=fa fa-twitter

# Responsive design classes
kcContentWrapperClass=main-container glass-strong rounded-3xl p-8 w-full max-w-md animate-bounce-in

# Typography
kcFormOptionsClass=flex items-center justify-between text-sm
kcFormOptionsWrapperClass=

# Links styling
kcFormPasswordVisibilityButtonClass=
kcFormPasswordVisibilityIconShow=
kcFormPasswordVisibilityIconHide=

# Registration specific
kcRegisterClass=space-y-6
kcFormButtonsClass=flex flex-col sm:flex-row gap-4 pt-4

# Additional utility classes
kcFormGroupErrorClass=
kcInputErrorMessageClass=text-red-300 text-sm mt-1

# Internationalization support
locales=en,es,fr,de,it,pt,nl,ru,ja,zh-CN

# Feature flags
features.login_screen_customization=true
features.recovery_codes=true
features.webauthn=true

# Custom properties for theme behavior
theme.displayInfo=true
theme.displayMessage=true  
theme.displayRequiredFields=true
theme.showLogo=true
theme.logoUrl=
theme.backgroundImage=
theme.primaryColor=#a855f7
theme.secondaryColor=#ec4899
theme.accentColor=#06b6d4

# Animation settings
theme.enableAnimations=true
theme.animationDuration=300
theme.enableParticles=true

# Glass effect settings
theme.glassOpacity=0.1
theme.glassBlur=20
theme.glassBorder=0.2

# Social login configuration
theme.socialProvidersEnabled=true
theme.socialProvidersPosition=bottom

# Form validation
theme.realTimeValidation=true
theme.passwordStrengthIndicator=true

# Custom CSS variables that can be overridden
css.variables=--glass-bg:rgba(255,255,255,0.1);--glass-border:rgba(255,255,255,0.2);--text-primary:rgba(255,255,255,0.9)

# Mobile optimization
theme.mobileOptimized=true
theme.touchFriendly=true

# Security features
theme.showPasswordToggle=true
theme.autoComplete=true

# Accessibility
theme.highContrast=false
theme.reducedMotion=false
theme.screenReaderSupport=true

# Performance
theme.minifyCSS=true
theme.minifyJS=true
theme.lazyLoadImages=true

# Custom metadata
theme.version=1.0.0
theme.author=Custom Theme Developer
theme.description=Modern glassmorphism theme for Keycloak authentication