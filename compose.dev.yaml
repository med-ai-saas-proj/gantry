networks:
  default:
    driver: bridge

services:
  db:
    image: pgvector/pgvector:pg18
    container_name: postgres-pgvector
    env_file:
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      # /var/lib/postgresql/data to /var/lib/postgresql: https://github.com/docker-library/postgres/pull/1259
      - postgres_data:/var/lib/postgresql
      - ./keycloak/keycloak_init.sql:/docker-entrypoint-initdb.d/keycloak_init.sql
    healthcheck:
      test: sh -c "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    env_file:
      - .env.redis
    volumes:
      - redis_data:/data
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: >
      start-dev
      --http-enabled=true
      --http-port=8080
      --hostname=localhost
      --hostname-strict=false
      --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

volumes:
  postgres_data:
  redis_data: