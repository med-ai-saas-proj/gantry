#:schema config-schema.json
stage = "DEV"
allowed_origins = ["http://localhost:3000", "http://localhost:3002"]
port = 8000
internal_port = 9000
log_level = "DEBUG"

[db]
timescale_connection_uri = "postgresql+asyncpg://gantry:123456@localhost:5432/gantry"
pgvector_connection_uri = "postgresql+asyncpg://gantry:123456@localhost:5432/gantry"
redis_connection_uri = "redis://localhost:6379/0"

[apikey]
secret = "your-minimum-16-char-secret-key"
secret_length = 32
permissions = [
    { id = "chat.read", name = "Chat Read", description = "Allow reading chat resources" },
    { id = "chat.run", name = "Chat Run", description = "Allow running chat operations" },
    { id = "conversation.read", name = "Conversation Read", description = "Allow reading conversations" },
    { id = "conversation.write", name = "Conversation Write", description = "Allow writing conversations" },
    { id = "conversation.delete", name = "Conversation Delete", description = "Allow deleting conversations" },
    { id = "file.read", name = "File Read", description = "Allow reading files" },
    { id = "file.write", name = "File Write", description = "Allow uploading files" },
    { id = "file.delete", name = "File Delete", description = "Allow deleting files" },
    { id = "rag.read", name = "RAG Read", description = "Allow reading RAG resources" },
    { id = "rag.write", name = "RAG Write", description = "Allow writing RAG resources" },
    { id = "chatbot", name = "Chatbot", description = "Allow using the chatbot" },
    { id = "medical-records", name = "Medical Records", description = "Allow managing medical records" },
]

[keycloak]
server_url = "http://localhost:8080/"
# For production behind a reverse proxy, keep server_url reachable by the
# backend and set these to the public issuer used in Keycloak tokens.
# public_server_url = "https://auth.example.com/"
# issuer_url = "https://auth.example.com/realms/gantry"
# jwks_url = "http://keycloak:8080/realms/gantry/protocol/openid-connect/certs"
realm_name = "gantry"
service_client_id = "gantry-backend"
service_client_secret = "sW4f7NOGqpcNmpstgfYbeBoUigJoA5EX"

[auth]
client_id = "gantry-frontend"
admin_client_id = "gantry-admin"

[rag]
embedding_openai_api_key = "sk-example"                 #apikey
embedding_openai_base_url = "https://api.openai.com/v1"
embedding_model = "text-embedding-3-small"
reranker_api_key = "sk-example"                         #apikey
reranker_base_url = "https://jina.ai/api/v1"            #apikey
reranker_model = "text-reranking-001"                   #apikey

[billing]
stripe_secret_key = "sk_test_example_key" #apikey
stripe_webhook_secret = ""                #apikey

[user_log]
loki_url = "http://localhost:3100/"

[conversation]
cache_ttl = 600
cache_limit = 50

[file_storage]
# Required: S3 / Object Storage configuration
s3_bucket_name = "private-files"           #apikey
s3_region_name = "us-east-1"               #apikey
s3_access_key_id = "rustfs-access-key"     #apikey
s3_secret_access_key = "rustfs-secret-key" #apikey
s3_endpoint_url = "http://localhost:9000"  #apikey
s3_presigned_url_expiry_seconds = 3600
redis_cache_expiry_seconds = 3600

[organization]
invite_client_id = "gantry-frontend"
invite_redirect_uri = "http://localhost:3000"
deletion_cancel_window_days = 30
deletion_worker_interval_seconds = 60

[observability]
exporter_otlp_endpoint = "http://localhost:4317/"
exporter_otlp_protocol = "grpc"
traces = "disabled"
metrics = "disabled"
logs = "disabled"
prometheus_port = 9000

[ai_gateway.models]
"gpt-oss-120b" = { provider = "groq", model_id = "openai/gpt-oss-120b", context_window = 128000, api_key = "gsk_", fallback = [
    "gpt-oss-20b",
] }
"gpt-oss-20b" = { provider = "groq", model_id = "openai/gpt-oss-20b", context_window = 128000, api_key = "gsk_" }
"deepseek-v4-flash" = { provider = "openai", model_id = "deepseek-v4-flash", context_window = 1000000, api_key = "sk-", base_url = "https://api.deepseek.com" }

[api_gateway]
routes = { "chat" = { "address" = "http://localhost:3000/chat/", required_perms = [
    "chatbot",
] }, "patients" = { address = "http://localhost:3000/patients/", required_perms = [
    "medical-records",
] }, "hospitalizations" = { address = "http://localhost:3000/hospitalizations/", required_perms = [
    "medical-records",
] }, "medical-records" = { address = "http://localhost:3000/medical-records/", required_perms = [
    "medical-records",
] }, "extract" = { address = "http://localhost:3000/extract/", required_perms = [
    "medical-records",
] } }

