[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "crawl4ai>=0.7.4",
    "fastapi[standard]>=0.116.1",
    "numpy>=2.3.3",
    "orjson>=3.11.3",
    "pandas>=2.3.2",
    "psycopg2-binary>=2.9.10",
    "pydantic-ai>=1.0.6",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.43",
    "structlog>=25.4.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "scalar-fastapi>=1.4.3",
    "ag-ui-protocol>=0.1.9",
    "fhir-resources>=8.1.0",
]

[tool.pyright]
exclude = ["*.pyi?$", "*__pycache__*", ".venv"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "inquirer>=3.4.1",
    "ipython>=9.5.0",
    "mako>=1.3.10",
    "openapi-generator-cli[jdk4py]>=7.15.0",
    "ruff>=0.13.2",
    "typer>=0.19.1",
]
