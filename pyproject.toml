[project]
name = "gantry"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "alembic>=1.18.4,<1.19",
    "fastapi[standard]>=0.136.3,<0.137",
    "orjson>=3.11.9,<3.12",
    "sqlalchemy>=2.0.50,<2.1",
    "structlog>=25.5.0,<25.6",
    "ag-ui-protocol>=0.1.18,<0.2",
    "asyncpg>=0.31.0,<0.32",
    "cssselect>=1.4.0,<1.5",
    "python-jose>=3.5.0,<3.6",
    "passlib[bcrypt]>=1.7.4,<1.8",
    "pydantic-settings>=2.14.1,<2.15",
    "fastuuid>=0.14.0,<0.15",
    "opentelemetry-api>=1.39.1,<1.40",
    "opentelemetry-sdk>=1.39.1,<1.40",
    "opentelemetry-exporter-otlp>=1.39.1,<1.40",
    "opentelemetry-instrumentation>=0.60b1,<0.61",
    "opentelemetry-instrumentation-fastapi>=0.60b1,<0.61",
    "opentelemetry-instrumentation-asyncpg>=0.60b1,<0.61",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b1,<0.61",
    "opentelemetry-instrumentation-redis>=0.60b1,<0.61",
    "opentelemetry-instrumentation-httpx>=0.60b1,<0.61",
    "opentelemetry-instrumentation-botocore>=0.60b1,<0.61",
    "filetype>=1.2.0,<1.3",
    "boto3>=1.43.16,<1.44",
    "pydantic-ai-slim[openai,vertexai,google,xai,groq,anthropic,mistral,cohere,bedrock,huggingface,cli,mcp,fastmcp,ag-ui,retries,ui,spec]>=1.107.0,<1.108",
    "python-keycloak>=7.1.1,<7.2",
    "uvloop>=0.22.1,<0.23; sys_platform == 'linux'",
    "sqlalchemy-timescaledb>=0.4.1,<0.5",
    "opentelemetry-instrumentation-system-metrics>=0.60b1,<0.61",
    "opentelemetry-exporter-prometheus>=0.60b1,<0.61",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1,<1.40",
    "stripe>=15.2.0,<15.3",
    "apscheduler>=3.11.2,<3.12",
    "pgvector>=0.4.2,<0.5",
    "openai>=2.38.0,<2.39",
    "pypdf>=6.12.2,<6.13",
    "python-docx>=1.2.0,<1.3",
    "openpyxl>=3.1.5,<3.2",
    "limits[async-redis]>=5.8.0,<5.9",
    "redis[hiredis]>=7.4.0,<7.5",
    "langchain-text-splitters>=1.1.2,<1.2",
    "beautifulsoup4>=4.14.3,<4.15",
]

[project.scripts]
gantry = "gantry.__main__:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "inquirer>=3.4.1,<3.5",
    "mako>=1.3.12,<1.4",
    "openapi-generator-cli[jdk4py]>=7.22.0,<7.23",
    "pre-commit>=4.6.0,<4.7",
    "ruff>=0.15.14,<0.16",
    "pyrefly>=1.0.0,<1.1",
    "boto3-stubs[s3]>=1.43.16,<1.44",
    "typer>=0.26.2,<0.27",
    "gantry",
    "pytest>=9.0.3,<9.1",
    "pytest-playwright>=0.8.0,<0.9",
    "testcontainers[keycloak,postgres,redis]>=4.14.2,<4.15",
    "pytest-order>=1.4.0,<1.5",
    "pytest-asyncio>=1.4.0,<1.5",
    "pytest-xdist>=3.8.0,<3.9",
    "pytest-cov>=7.1.0,<7.2",
    "pytest-timeout>=2.4.0,<2.5",
    "pytest-snapshot>=0.9.0,<0.10",
    "pytest-benchmark>=5.2.3,<5.3",
    "pytest-mock>=3.15.1,<3.16",
    "allure-pytest>=2.16.0,<2.17",
    "faker>=40.19.1,<40.20",
    "fakeredis>=2.35.1,<2.36",
    "freezegun>=1.5.5,<1.6",
    "locust>=2.44.0,<2.45",
    "respx>=0.23.1,<0.24",
    "deepdiff>=9.1.0,<9.2",
    "schemathesis>=4.20.2,<4.21",
    "factory-boy>=3.3.3,<3.4",
    "pyjwt>=2.13.0,<2.14",
    "aiohttp>=3.13.5,<3.14",
    "datasets>=4.8.5,<4.9",
    "scalar-fastapi>=1.8.2,<1.9",
]

[tool.pyrefly]
project-includes = ["src", "scripts", "templates"]
project-excludes = ["**/.[!/.]*", "**/tests", "**/__pycache__"]
search-path = ["."]

[tool.coverage.run]
source = ["src/gantry"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true

[tool.uv.build-backend]
source-exclude = ["*_test.py"]
module-name = ["gantry", "pyrusult"]
