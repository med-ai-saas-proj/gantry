[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "crawl4ai>=0.7.4",
    "fastapi[standard]>=0.116.1",
    "orjson>=3.11.3",
    "pydantic-ai>=1.0.6",
    "sqlalchemy>=2.0.43",
    "structlog>=25.4.0",
    "scalar-fastapi>=1.4.3",
    "ag-ui-protocol>=0.1.9",
    "fhir-resources>=8.1.0",
    "asyncpg>=0.30.0",
    "cssselect>=1.3.0",
    "python-jose>=3.5.0",
    "passlib[bcrypt]==1.7.4",
    "redis>=7.0.1",
    "pydantic-settings>=2.11.0",
    "safe-result>=4.0.3",
    "fastuuid==0.14.0",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-exporter-otlp>=1.39.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0",
    "opentelemetry-sdk>=1.39.0",
    "filetype>=1.2.0",
    "boto3>=1.40.61",
]

[tool.pyrefly]
project-includes = ["src", "scripts", "alembic", "templates"]
project-excludes = ["**/.[!/.]*", "**/tests", "**/__pycache__"]
search-path = ["."]

[dependency-groups]
dev = [
    "inquirer>=3.4.1",
    "ipython>=9.5.0",
    "mako>=1.3.10",
    "openapi-generator-cli[jdk4py]>=7.15.0",
    "pre-commit>=4.4.0",
    "pyright>=1.1.407",
    "ruff>=0.14.4",
    "typer>=0.19.1",
    "pyrefly==0.45.0",
    "boto3-stubs[s3]>=1.42.33",
]
