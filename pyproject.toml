[project]
name = "gantry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "alembic>=1.16.5",
    "fastapi[standard]>=0.135.1",
    "orjson>=3.11.3",
    "sqlalchemy>=2.0.43",
    "structlog>=25.4.0",
    "ag-ui-protocol>=0.1.9",
    "asyncpg>=0.30.0",
    "cssselect>=1.3.0",
    "python-jose>=3.5.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings>=2.11.0",
    "fastuuid==0.14.0",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation>=0.60b1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-asyncpg>=0.60b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b1",
    "opentelemetry-instrumentation-redis>=0.60b1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "opentelemetry-instrumentation-botocore>=0.60b1",
    "filetype>=1.2.0",
    "boto3>=1.40.61",
    "pydantic-ai-slim[openai,vertexai,google,xai,groq,anthropic,mistral,cohere,bedrock,huggingface,cli,mcp,fastmcp,ag-ui,retries,ui,spec]>=1.107.0",
    "python-keycloak>=5.3.1",
    "uvloop>=0.22.1; sys_platform == 'linux'",
    "sqlalchemy-timescaledb>=0.4.1",
    "opentelemetry-instrumentation-system-metrics>=0.60b1",
    "opentelemetry-exporter-prometheus>=0.60b1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1",
    "stripe>=14.4.1",
    "apscheduler>=3.11.2",
    "pgvector>=0.4.2",
    "openai>=1.109.1",
    "pypdf>=6.1.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "limits[async-redis]>=5.8.0",
    "redis[hiredis]>=7.4.0",
    "langchain-text-splitters>=1.1.2",
    "beautifulsoup4>=4.14.3",
]


[build-system]
requires = ["uv_build>=0.9.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "inquirer>=3.4.1",
    "mako>=1.3.10",
    "openapi-generator-cli[jdk4py]>=7.15.0",
    "pre-commit>=4.4.0",
    "pytest>=8.4.2",
    "ruff>=0.14.4",
    "pyrefly>=0.45.0",
    "boto3-stubs[s3]>=1.42.33",
    "typer>=0.24.1",
    "gantry",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
    "testcontainers[keycloak,postgres,redis]>=4.14.2",
    "pytest-order>=1.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-snapshot>=0.9.0",
    "pytest-benchmark>=5.2.3",
    "pytest-mock>=3.15.1",
    "allure-pytest>=2.16.0",
    "faker>=40.15.0",
    "fakeredis>=2.35.1",
    "freezegun>=1.5.5",
    "locust>=2.43.4",
    "respx>=0.23.1",
    "deepdiff>=9.0.0",
    "schemathesis>=4.18.1",
    "factory-boy>=3.3.3",
    "pyjwt>=2.12.1",
    "aiohttp>=3.13.5",
    "datasets>=3.6.0",
    "scalar-fastapi>=1.8.1",
]

[tool.pyrefly]
project-includes = ["src", "scripts", "alembic", "templates"]
project-excludes = ["**/.[!/.]*", "**/tests", "**/__pycache__"]
search-path = ["."]

[tool.coverage.run]
source = ["src/gantry"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true

[tool.uv.build-backend]
source-exclude = ["*_test.py"]
module-name = ["gantry", "pyrusult"]
