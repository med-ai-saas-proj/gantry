name: Automation Tests

on:
  pull_request:
    branches: [dev]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: automation-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13.5
      - run: uv sync --group dev
      - name: Run scheduled/headless smoke tests
        env:
          GANTRY_SERVER__CONFIG_FILE: example.gantry.toml
          PYTHONPATH: src
          AUTOMATION_COVERAGE_FAIL_UNDER: "0"
        run: make test-automation
