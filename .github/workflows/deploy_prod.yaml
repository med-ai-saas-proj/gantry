name: Build and Deploy to VM

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # This script will run on the hosting server
            # Allow git clone ssh from github server
            mkdir -p -m 0700 $HOME/.ssh && ssh-keyscan github.com >> $HOME/.ssh/known_hosts

            # Read access to https://github.com/Venera-AI/patient-record-processing
            echo "${{ secrets.SCHEMA_REPO_READ_SSH_KEY }}" > $HOME/.ssh/schema_repo_read_ssh_key
            sudo chmod 600 $HOME/.ssh/schema_repo_read_ssh_key

            # Read access to this repo
            echo "${{ secrets.API_HUB_DEPLOY_KEY }}" > $HOME/.ssh/deployment_key
            sudo chmod 600 $HOME/.ssh/deployment_key

            # Clone or pull this repo
            ssh-agent bash -c "ssh-add $HOME/.ssh/deployment_key; if [ -d repo ]; then (cd repo && git pull); else git clone git@github.com:${{ github.repository }}.git repo;fi"
            cd repo

            # Update env files (.env and .env.postgres)
            echo "${{ secrets.ENV_FILE }}" > prod.env
            echo "${{ secrets.POSTGRES_ENV_FILE }}" > .env.postgres

            # Stop the current container and start the new one
            sudo docker compose -f compose.yaml build \
              --ssh schema_repo_read_ssh_key=$HOME/.ssh/schema_repo_read_ssh_key
            sudo docker compose -f compose.yaml up -d

            # Clean up old, unused Docker images to save space
            sudo docker image prune -af
