name: Build and Deploy to VM

on:
  push:
    branches:
      - main # Or your deployment branch
      - master # Or your deployment branch
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build_and_push # This job runs only after the build job succeeds

    steps:
      - name: Construct environment variables
        run: |
          chmod 600 /home/runner/schema_repo_read_ssh_key
        env:
          REPO: ${{ github.repository }}

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p $HOME/.ssh/
            echo "${{ secrets.SCHEMA_REPO_READ_SSH_KEY }}" > $HOME/.ssh/schema_repo_read_ssh_key
            echo "${{ secrets.API_HUB_DEPLOY_KEY }}" > $HOME/.ssh/deployment_key

            ssh-agent bash -c "ssh-add $HOME/.ssh/deployment_key; if [ -d repo ]; then (cd repo && git pull); else git clone git@github.com:${{ env.GITHUB_REPOSITORY }}.git repo;fi"

            cd repo

            # Update .env and .env.postgres
            echo "${{ secrets.ENV_FILE }}" > prod.env
            echo "${{ secrets.POSTGRES_ENV_FILE }}" > .env.postgres

            # Stop the current container and start the new one
            sudo docker compose -f compose.yaml up -d --build --force-recreate

            # Clean up old, unused Docker images to save space
            sudo docker image prune -af
