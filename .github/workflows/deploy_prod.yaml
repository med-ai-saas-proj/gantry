name: Build and Deploy to VM

on:
  push:
    branches:
      - main # Or your deployment branch
      - master # Or your deployment branch
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Branch to run on"
        required: true
        default: "main"
        type: string

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Construct environment variables
        run: |
          echo "IMAGE_NAME=ghcr.io/${REPO,,}" >> ${GITHUB_ENV}
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> ${GITHUB_ENV}
        env:
          REPO: ${{ github.repository }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Create an SSH key file from the GitHub secret
      - name: Create SSH key for pip
        run: |
          echo "${{ secrets.SCHEMA_REPO_READ_SSH_KEY }}" > /home/runner/schema_repo_read_ssh_key
          chmod 600 /home/runner/schema_repo_read_ssh_key
          stat /home/runner/schema_repo_read_ssh_key

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=inline,ref=${{ env.IMAGE_NAME }}:buildcache
          # This is the magic part for the private pip install
          ssh: |
            schema_repo_read_ssh_key=/home/runner/schema_repo_read_ssh_key

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build_and_push # This job runs only after the build job succeeds

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Navigate to your app directory
            cd /home/${{ secrets.VM_USERNAME }}/my-app

            # Set environment variables for docker-compose
            export IMAGE_NAME=${{ env.IMAGE_NAME }}

            # Log in to GHCR on the VM to be able to pull the image
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Update .env and .env.postgres
            echo "${{ secrets.ENV_FILE }}" > prod.env
            echo "${{ secrets.POSTGRES_ENV_FILE }}" > .env.postgres

            # Pull the latest image
            docker-compose pull

            # Stop the current container and start the new one
            docker-compose up -d --force-recreate

            # Clean up old, unused Docker images to save space
            docker image prune -af
