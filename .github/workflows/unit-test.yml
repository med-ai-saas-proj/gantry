name: Unit Tests

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13.5
      - run: uv sync --group dev
      - name: Run source-adjacent unit tests
        env:
          GANTRY_SERVER__CONFIG_FILE: example.gantry.toml
          PYTHONPATH: src
        run: make test-unit
      - name: Upload unit reports
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: reports/unit
          if-no-files-found: ignore
