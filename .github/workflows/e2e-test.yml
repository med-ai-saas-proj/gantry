name: E2E Tests

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13.5
      - run: uv sync --group dev
      - name: Choose E2E host port
        run: |
          PORT="$(python -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')"
          echo "E2E_HOST_PORT=${PORT}" >> "${GITHUB_ENV}"
          echo "E2E_BASE_URL=http://localhost:${PORT}" >> "${GITHUB_ENV}"
      - name: Run backend-first full-stack E2E tests
        env:
          GANTRY_SERVER__CONFIG_FILE: example.gantry.toml
          PYTHONPATH: src
        run: make test-e2e-backend
      - name: Collect compose logs
        if: ${{ always() }}
        run: |
          mkdir -p reports/e2e
          docker compose -f compose.yaml -f docker/docker-compose.e2e.yml logs --no-color > reports/e2e/compose.log || true
      - name: Collect Mailpit messages
        if: ${{ always() }}
        run: |
          mkdir -p reports/e2e
          curl -fsS http://localhost:8025/api/v1/messages > reports/e2e/mailpit-messages.json || true
      - name: Upload E2E artifacts
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-artifacts
          path: reports/e2e
          if-no-files-found: ignore
