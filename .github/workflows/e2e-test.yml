name: E2E Tests

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13.5
      - run: uv sync --group dev
      - name: Choose E2E host port
        run: |
          python - <<'PY' >> "${GITHUB_ENV}"
          import socket

          names = [
              "E2E_HOST_PORT",
              "E2E_POSTGRES_HOST_PORT",
              "E2E_REDIS_HOST_PORT",
              "E2E_KEYCLOAK_HOST_PORT",
              "E2E_MAILPIT_HTTP_HOST_PORT",
              "E2E_MAILPIT_SMTP_HOST_PORT",
              "E2E_MINIO_API_HOST_PORT",
              "E2E_MINIO_CONSOLE_HOST_PORT",
          ]
          sockets = []
          ports = {}
          for name in names:
              sock = socket.socket()
              sock.bind(("", 0))
              ports[name] = sock.getsockname()[1]
              sockets.append(sock)
          for name, port in ports.items():
              print(f"{name}={port}")
          print(f"E2E_BASE_URL=http://localhost:{ports['E2E_HOST_PORT']}")
          print(f"KEYCLOAK_URL=http://localhost:{ports['E2E_KEYCLOAK_HOST_PORT']}")
          print(f"MAILPIT_API_URL=http://localhost:{ports['E2E_MAILPIT_HTTP_HOST_PORT']}")
          print(f"MINIO_URL=http://localhost:{ports['E2E_MINIO_API_HOST_PORT']}")
          print("E2E_FORCE_COMPOSE=1")
          for sock in sockets:
              sock.close()
          PY
      - name: Use existing local E2E stack under act
        if: ${{ env.ACT == 'true' }}
        run: |
          echo "E2E_SKIP_COMPOSE=1" >> "${GITHUB_ENV}"
          echo "E2E_FORCE_COMPOSE=0" >> "${GITHUB_ENV}"
          echo "E2E_BASE_URL=http://localhost:8000" >> "${GITHUB_ENV}"
          echo "KEYCLOAK_URL=http://localhost:8080" >> "${GITHUB_ENV}"
          echo "MAILPIT_API_URL=http://localhost:8025" >> "${GITHUB_ENV}"
          echo "MINIO_URL=http://localhost:9000" >> "${GITHUB_ENV}"
      - name: Run backend-first full-stack E2E tests
        env:
          GANTRY_SERVER__CONFIG_FILE: example.gantry.toml
          PYTHONPATH: src
        run: make test-e2e-backend
