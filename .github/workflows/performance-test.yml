name: Performance Tests

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      run_load_smoke:
        description: "Run optional k6/Locust load smoke against BASE_URL"
        required: false
        default: "false"
      base_url:
        description: "Target server URL for optional load smoke"
        required: false
        default: "http://localhost:8000"

concurrency:
  group: performance-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13.5
      - run: uv sync --group dev
      - name: Run benchmark tests
        env:
          GANTRY_SERVER__CONFIG_FILE: example.gantry.toml
          PYTHONPATH: src
        run: make test-perf

  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_load_smoke == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13.5
      - run: uv sync --group dev
      - name: Install k6
        run: |
          sudo gpg -k || true
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run k6 load smoke
        env:
          BASE_URL: ${{ inputs.base_url }}
          USER_TOKEN: ${{ secrets.PERF_USER_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.PERF_ADMIN_TOKEN }}
          API_KEY: ${{ secrets.PERF_API_KEY }}
        run: make test-load-k6
      - name: Run Locust load smoke
        env:
          BASE_URL: ${{ inputs.base_url }}
          LOCUST_USER_TOKEN: ${{ secrets.PERF_USER_TOKEN }}
          LOCUST_ADMIN_TOKEN: ${{ secrets.PERF_ADMIN_TOKEN }}
          LOCUST_API_KEY: ${{ secrets.PERF_API_KEY }}
        run: make test-load-locust
